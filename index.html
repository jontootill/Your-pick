<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Your Pick</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Password Overlay Screen -->
<div id="passwordOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:99999; font-family:sans-serif; text-align:center;">
  <div style="background:#1e293b; padding:2rem; border-radius:1rem; box-shadow:0 10px 25px rgba(0,0,0,0.5); max-width:320px; width:90%;">
    <h2 style="margin-top:0; font-size:1.25rem;">Password Required</h2>
    <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:1rem;">Please enter the password to continue.</p>
    <input type="password" id="appPasswordInput" placeholder="Password" style="width:100%; padding:0.6rem; border-radius:0.5rem; border:1px solid #334155; background:#0f172a; color:#fff; margin-bottom:1rem; box-sizing:border-box;">
    <button onclick="checkPassword()" style="width:100%; padding:0.6rem; border-radius:0.5rem; border:none; background:#4f46e5; color:#fff; font-weight:bold; cursor:pointer;">Enter</button>
    <p id="passError" style="color:#f43f5e; font-size:0.75rem; margin-top:0.5rem; display:none;">Incorrect password</p>
  </div>
</div>

<script>
  const CORRECT_PASSWORD = "261213";

  // Auto-unlock if authenticated in this session
  if (sessionStorage.getItem("authenticated") === "true") {
    document.getElementById("passwordOverlay").style.display = "none";
  }

  function checkPassword() {
    const input = document.getElementById("appPasswordInput").value;
    if (input === CORRECT_PASSWORD) {
      sessionStorage.setItem("authenticated", "true");
      document.getElementById("passwordOverlay").style.display = "none";
    } else {
      document.getElementById("passError").style.display = "block";
    }
  }
</script>
  <!-- START SCREEN -->
<div id="start-screen" class="screen">
  <h1>Your Pick</h1>
  <p class="subtitle">A little game for two</p>

  <div class="player-setup">
    <div class="player-box">
      <label>Player 1</label>
      <input type="text" id="player1-name" placeholder="Name" value="Player 1">
      <div class="gender-select">
        <button class="gender-btn active" data-player="1" data-gender="female">Female</button>
        <button class="gender-btn" data-player="1" data-gender="male">Male</button>
      </div>
    </div>

    <div class="player-box">
      <label>Player 2</label>
      <input type="text" id="player2-name" placeholder="Name" value="Player 2">
      <div class="gender-select">
        <button class="gender-btn active" data-player="2" data-gender="male">Male</button>
        <button class="gender-btn" data-player="2" data-gender="female">Female</button>
      </div>
    </div>
  </div>

  <div class="heat-select">
    <p>Starting heat level</p>
    <div class="heat-buttons">
      <button class="heat-btn active" data-heat="vanilla">Vanilla</button>
      <button class="heat-btn" data-heat="medium">Medium</button>
      <button class="heat-btn" data-heat="spicy">Spicy</button>
    </div>
  </div>

  <button id="start-btn" class="main-btn">Start Game</button>
</div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div class="top-bar">
  <h1 class="home-link" id="home-link">Your Pick</h1>
  <div class="top-right">
    <span id="current-heat">Vanilla</span>
    <button id="change-heat-btn">Change Heat</button>
  </div>
</div>

    <h2 id="question-text">Question goes here</h2>

    <!-- THIS SECTION WAS PROBABLY MISSING -->
    <div id="turn-section">
      <p class="turn-label">Whose turn is it?</p>
      <div class="turn-buttons">
        <button id="p1-turn-btn" class="turn-btn">Player 1</button>
        <button id="p2-turn-btn" class="turn-btn">Player 2</button>
      </div>
    </div>

    <div id="options-container" class="options hidden"></div>

    <div class="status">
      <div id="p1-status">Not chosen yet</div>
      <div id="p2-status">Not chosen yet</div>
    </div>

    <button id="reveal-btn" class="main-btn" disabled>Reveal Choices</button>
  </div>

  <!-- REVEAL SCREEN -->
  <div id="reveal-screen" class="screen hidden">
    <div id="reveal-content"></div>
    <button id="next-btn" class="main-btn">Next Round</button>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
